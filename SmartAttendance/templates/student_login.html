<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Attendance</title>
    <link rel="stylesheet" href="/static/site.css">
</head>
<body class="centered">
    <main>
        <h1>Student Attendance</h1>
        <form method="POST">
            <div class="field">
                <label for="class_id">Class</label>
                <select id="class_id" name="class_id" required>
                    <option value="">Select or scan a class</option>
                    {% for class in classes %}
                    <option value="{{ class.id }}">{{ class.name }} (Class {{ class.id }})</option>
                    {% endfor %}
                </select>
            </div>
            <div class="field">
                <button type="button" id="scanQrBtn" class="secondary">Scan Class QR Code</button>
                <div id="scannerPanel" hidden>
                    <video id="qrVideo" autoplay playsinline></video>
                    <button type="button" id="stopScanBtn">Stop Scanner</button>
                    <p id="scanStatus">Camera starting...</p>
                </div>
            </div>
            <div class="field">
                <label for="student_id">Student ID</label>
                <input type="text" id="student_id" name="student_id" autocomplete="off" required>
            </div>
            <div class="field">
                <label for="session_code">Session Code</label>
                <input type="text" id="session_code" name="session_code" inputmode="numeric" autocomplete="off" required>
            </div>
            <button type="submit">Submit Attendance</button>
        </form>
        <div class="divider">Staff access</div>
        <a class="button secondary" href="/teacher/login">Open Teacher Dashboard</a>
        {% if message %}<div class="message">{{ message }}</div>{% endif %}
    </main>
    <script>
        const scanBtn = document.getElementById("scanQrBtn");
        const stopBtn = document.getElementById("stopScanBtn");
        const panel = document.getElementById("scannerPanel");
        const video = document.getElementById("qrVideo");
        const statusText = document.getElementById("scanStatus");
        const classSelect = document.getElementById("class_id");
        let stream;
        let scanTimer;

        function extractClassId(value) {
            const text = value.trim();
            if (/^\d+$/.test(text)) return text;
            if (text.startsWith("CLASS:")) return text.slice(6).trim();
            try {
                const parsed = JSON.parse(text);
                if (parsed.class_id) return String(parsed.class_id);
            } catch (_) {}
            try {
                const url = new URL(text);
                return url.searchParams.get("class_id") || url.searchParams.get("class") || "";
            } catch (_) {}
            return "";
        }

        function extractQrData(value) {
            try {
                const parsed = JSON.parse(value);
                return {
                    classId: parsed.class_id ? String(parsed.class_id) : "",
                    sessionCode: parsed.session_code ? String(parsed.session_code) : ""
                };
            } catch (_) {
                return {classId: extractClassId(value), sessionCode: ""};
            }
        }

        async function stopScanner() {
            clearInterval(scanTimer);
            if (stream) stream.getTracks().forEach(track => track.stop());
            stream = undefined;
            panel.hidden = true;
        }

        scanBtn.addEventListener("click", async () => {
            if (!("BarcodeDetector" in window)) {
                statusText.textContent = "QR scanning requires current Chrome or Edge on HTTPS or localhost.";
                panel.hidden = false;
                return;
            }
            try {
                stream = await navigator.mediaDevices.getUserMedia({video: {facingMode: "environment"}});
                video.srcObject = stream;
                panel.hidden = false;
                statusText.textContent = "Point the camera at the class QR code.";
                const detector = new BarcodeDetector({formats: ["qr_code"]});
                scanTimer = setInterval(async () => {
                    if (!video.videoWidth) return;
                    const codes = await detector.detect(video);
                    if (!codes.length) return;
                    const qrData = extractQrData(codes[0].rawValue);
                    const classId = qrData.classId || extractClassId(codes[0].rawValue);
                    if ([...classSelect.options].some(option => option.value === classId)) {
                        classSelect.value = classId;
                        if (qrData.sessionCode) {
                            document.getElementById("session_code").value = qrData.sessionCode;
                        }
                        statusText.textContent = `Class ${classId} selected.`;
                        await stopScanner();
                    } else {
                        statusText.textContent = "This QR code is not a registered class.";
                    }
                }, 500);
            } catch (_) {
                panel.hidden = false;
                statusText.textContent = "Camera access was denied or is unavailable.";
            }
        });
        stopBtn.addEventListener("click", stopScanner);
    </script>
</body>
</html>
