<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Johnson–Trotter · random practice</title>
  <link rel="stylesheet" href="styles.css">
  <!-- Using shared styles.css for layout and inputs -->
</head>
<body>
<div class="wrap">
  <header>
    <h1>⤵ Johnson–Trotter · random</h1>
    <p class="sub">Fill each row with the permutation produced by the algorithm. Arrows show each element's direction.</p>
  </header>

  <div class="card">
    <div class="controls">
      <button class="btn-primary" id="genBtn">⟳ New random start</button>
      <div class="stats" id="stats">Generated: 0</div>
    </div>
    <div id="mainArea"></div>
    <p style="margin-top:18px;"><a class="btn-secondary" href="index.html">← Back</a></p>
  </div>
</div>

<script>
  (function() {
    // ---------- Johnson–Trotter (generic) ----------
    function johnsonTrotter(initialPerm) {
      const n = initialPerm.length;
      const perm = initialPerm.slice();
      // direction: -1 = left, +1 = right
      const dir = new Array(n).fill(-1);
      const perms = [];

      // helper: clone
      const snapshot = () => perm.slice();

      perms.push(snapshot());

      while (true) {
        let mobileVal = -Infinity;
        let mobileIdx = -1;

        for (let i = 0; i < n; i++) {
          const d = dir[i];
          const ni = i + d;
          if (ni >= 0 && ni < n && perm[i] > perm[ni]) {
            if (perm[i] > mobileVal) {
              mobileVal = perm[i];
              mobileIdx = i;
            }
          }
        }

        if (mobileIdx === -1) break;

        const i = mobileIdx;
        const j = i + dir[i];

        // swap values
        [perm[i], perm[j]] = [perm[j], perm[i]];
        // swap directions
        [dir[i], dir[j]] = [dir[j], dir[i]];

        // reverse direction of elements greater than mobileVal
        for (let k = 0; k < n; k++) {
          if (perm[k] > mobileVal) dir[k] = -dir[k];
        }

        perms.push(snapshot());
      }

      return perms;
    }

    // ---------- state ----------
    const state = {
      perms: [],          // array of arrays
      filled: [],         // boolean / stored values
      arrowMap: {},       // store direction per permutation (index -> dir array)
      startPerm: null
    };

    // ---------- render ----------
    function render() {
      const area = document.getElementById('mainArea');
      area.innerHTML = '';

      // show starting permutation prominently
      if (state.startPerm) {
        const startLine = document.createElement('div');
        startLine.className = 'perm-row';
        const label = document.createElement('div');
        label.style.fontWeight = '600';
        label.style.marginBottom = '8px';
        label.textContent = 'Start permutation:';
        startLine.appendChild(label);
        const badges = document.createElement('div');
        badges.style.display = 'flex';
        badges.style.gap = '8px';
        badges.style.marginBottom = '12px';
        state.startPerm.forEach(v => {
          const sp = document.createElement('div');
          sp.className = 'value-badge';
          sp.textContent = v;
          badges.appendChild(sp);
        });
        startLine.appendChild(badges);
        area.appendChild(startLine);
      }

      const table = document.createElement('table');
      table.className = 'trace-table';

      // header
      const thead = document.createElement('thead');
      thead.innerHTML = `<tr><th>#</th><th>1st</th><th>2nd</th><th>3rd</th><th>arrows</th></tr>`;
      table.appendChild(thead);

      const tbody = document.createElement('tbody');
      table.appendChild(tbody);

      const perms = state.perms;

      for (let i = 0; i < perms.length; i++) {
        const tr = document.createElement('tr');
        const rowIdx = i;
        const perm = perms[i];

        // # column
        const tdNum = document.createElement('td');
        tdNum.textContent = i + 1;
        tdNum.style.fontWeight = '500';
        tdNum.style.color = '#2c3e50';
        tr.appendChild(tdNum);

        // three value columns (inputs)
        const inputs = [];
       for (let k = 0; k < 3; k++) {
  const td = document.createElement('td');

  if (i === 0) {
    td.textContent = state.startPerm[k];
    td.style.fontWeight = '600';
    td.style.background = '#eef6ff';
  } else {
    const inp = document.createElement('input');
    inp.type = 'number';
    inp.min = Math.min(...perms.flat());
    inp.max = Math.max(...perms.flat());

    td.appendChild(inp);
  }

  tr.appendChild(td);
}

        // arrows column (display direction)
        const tdArrows = document.createElement('td');
        tdArrows.style.fontSize = '1.3rem';
        tdArrows.style.letterSpacing = '2px';
        tdArrows.style.color = '#1f3a5f';
        tdArrows.style.fontWeight = '400';

        // get directions for this permutation (if we stored them)
        let dirs = state.arrowMap[i];
        if (!dirs) {
          // fallback: compute direction from previous? we store at generation time.
          dirs = new Array(3).fill('←');
        }
        const arrowSymbols = dirs.map(d => d === -1 ? '←' : '→');
        tdArrows.textContent = arrowSymbols.join('  ');
        tr.appendChild(tdArrows);

        tbody.appendChild(tr);
      }

      area.appendChild(table);

      // ---- actions ----
      const actions = document.createElement('div');
      actions.className = 'row-actions';

      const checkBtn = document.createElement('button');
      checkBtn.className = 'btn-primary';
      checkBtn.textContent = '✓ Check answers';

      const revealBtn = document.createElement('button');
      revealBtn.className = 'btn-secondary';
      revealBtn.textContent = 'Reveal all';

      const fb = document.createElement('span');
      fb.className = 'feedback';

      actions.appendChild(checkBtn);
      actions.appendChild(revealBtn);
      actions.appendChild(fb);
      area.appendChild(actions);

      // ---- check ----
      checkBtn.addEventListener('click', function() {
        let allOk = true;
        const rows = tbody.querySelectorAll('tr');
        let anyChange = false;

        rows.forEach((tr, idx) => {
          const inputs = tr.querySelectorAll('input');
          const correct = state.perms[idx];
          if (!correct) return;

          let rowOk = true;
          inputs.forEach((inp, k) => {
            const val = parseInt(inp.value, 10);
            const isCorrect = (val === correct[k]);
            if (!isCorrect) {
              inp.classList.remove('correct');
              inp.classList.add('incorrect');
              rowOk = false;
              allOk = false;
            } else {
              inp.classList.remove('incorrect');
              inp.classList.add('correct');
            }
          });

          if (rowOk) {
            // disable and store filled
            inputs.forEach((inp, k) => {
              inp.disabled = true;
              if (!state.filled[idx]) state.filled[idx] = [];
              state.filled[idx][k] = correct[k];
            });
            anyChange = true;
          }
        });

        if (allOk) {
          fb.className = 'feedback show good';
          fb.textContent = '✓ All correct! Perfect.';
          document.getElementById('stats').textContent = 'Generated: ' + state.perms.length;
        } else {
          fb.className = 'feedback show bad';
          fb.textContent = '✗ Some values are incorrect — try again.';
        }
      });

      // ---- reveal ----
      revealBtn.addEventListener('click', function() {
        const rows = tbody.querySelectorAll('tr');
        rows.forEach((tr, idx) => {
          const inputs = tr.querySelectorAll('input');
          const correct = state.perms[idx];
          if (!correct) return;
          inputs.forEach((inp, k) => {
            inp.value = correct[k];
            inp.disabled = true;
            inp.classList.remove('incorrect');
            inp.classList.add('correct');
            if (!state.filled[idx]) state.filled[idx] = [];
            state.filled[idx][k] = correct[k];
          });
        });
        document.getElementById('stats').textContent = 'Generated: ' + state.perms.length;
        fb.className = 'feedback show good';
        fb.textContent = '🔍 Revealed – study the order.';
      });
    }

    // ---------- generate with random initial values ----------
    function generateRandomStart() {
      // random distinct values for n=3 (range 1..9)
      let vals = [];
      while (vals.length < 3) {
        const r = Math.floor(Math.random() * 9) + 1;
        if (!vals.includes(r)) vals.push(r);
      }
      // shuffle more
      for (let i = vals.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [vals[i], vals[j]] = [vals[j], vals[i]];
      }
      return vals;
    }

    function generateAndRender() {
      const start = generateRandomStart();
      const perms = johnsonTrotter(start);

      // store directions for each permutation (compute from differences)
      const arrowMap = {};
      for (let i = 0; i < perms.length; i++) {
        const perm = perms[i];
        const dirs = [];
        // compare with next perm to infer direction? 
        // But Johnson–Trotter internal direction is lost after generation.
        // We'll re-run a small JT to capture directions for this exact start.
        // Simpler: recompute with a modified JT that stores directions.
        // We'll re-use johnsonTrotter but store dirs snapshot.
        // Instead: we compute direction by using the algorithm again, but we keep dirs.
        // Let's just generate dirs alongside.
        // We'll use a separate function that returns both perms and dirs.
        // ----- inline rebuild with dirs -----
        const { perms: p, dirs: d } = johnsonTrotterWithDirs(start);
        // now d[i] is array of directions for each element at step i
        for (let i = 0; i < p.length; i++) {
          arrowMap[i] = d[i] || new Array(3).fill(-1);
        }
        // overwrite state
        state.startPerm = start;
        state.perms = p;
        state.arrowMap = arrowMap;
        state.filled = new Array(p.length).fill(null).map(() => []);
        // mark first row as filled with the starting permutation so it's shown
        state.filled[0] = start.slice();
        render();
        document.getElementById('stats').textContent = 'Generated: ' + p.length;
        return;
      }
    }

    // helper that returns both permutations and direction arrays
    function johnsonTrotterWithDirs(initialPerm) {
      const n = initialPerm.length;
      const perm = initialPerm.slice();
      const dir = new Array(n).fill(-1);
      const perms = [];
      const dirs = [];

      const snapshot = () => perm.slice();
      const dirSnapshot = () => dir.slice();

      perms.push(snapshot());
      dirs.push(dirSnapshot());

      while (true) {
        let mobileVal = -Infinity;
        let mobileIdx = -1;

        for (let i = 0; i < n; i++) {
          const d = dir[i];
          const ni = i + d;
          if (ni >= 0 && ni < n && perm[i] > perm[ni]) {
            if (perm[i] > mobileVal) {
              mobileVal = perm[i];
              mobileIdx = i;
            }
          }
        }

        if (mobileIdx === -1) break;

        const i = mobileIdx;
        const j = i + dir[i];

        [perm[i], perm[j]] = [perm[j], perm[i]];
        [dir[i], dir[j]] = [dir[j], dir[i]];

        for (let k = 0; k < n; k++) {
          if (perm[k] > mobileVal) dir[k] = -dir[k];
        }

        perms.push(snapshot());
        dirs.push(dirSnapshot());
      }

      return { perms, dirs };
    }

    // ----- attach event -----
    document.getElementById('genBtn').addEventListener('click', function() {
      generateAndRender();
    });

    // ----- initial load -----
    window.addEventListener('DOMContentLoaded', function() {
      generateAndRender();
    });

  })();
</script>
</body>
</html>
