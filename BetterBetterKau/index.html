<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Schedule Builder</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="light-theme.css">
    <link rel="icon" href="data:,">
    <script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>
</head>
<body>

    <div id="messageContainer"></div>

    <div class="content">
        <div class="course-selector">
            <div class="selector-group">
                <div id="prebuilt-loader-container" style="margin-bottom: 1.5rem;"></div>
                <label>Search for Course:</label>
                <div class="custom-dropdown" id="courseDropdown">
                    <div class="dropdown-toggle" onclick="toggleDropdown()">
                        <span class="dropdown-text">Select a course...</span>
                        <span class="dropdown-arrow">▼</span>
                    </div>
                    <div class="dropdown-menu" id="dropdownMenu" style="display: none;">
                        <input type="text" class="dropdown-search" placeholder="Type to search..." onkeyup="filterCourses()">
                        <div class="dropdown-options" id="courseOptions"></div>
                    </div>
                </div>
            </div>

            <div class="selector-group">
                <label>Select Section:</label>
                <select id="sectionSelect" disabled onchange="handleSectionSelect()">
                    <option value="">Select a course first...</option>
                </select>
            </div>

            <button id="addBtn" onclick="addCourseToSchedule()" disabled>+ Add Course</button>
        </div>

        <div class="schedule-container">
            <div class="schedule-header">
                <h3>Weekly Schedule</h3>
                <div class="credit-hours-display">
                    Total Hours: <span id="totalHours">0</span>
                </div>
                <div class="schedule-buttons">
                    <button id="themeToggle" class="btn-secondary">🌙 Dark Mode</button>
                    <button class="add-custom-btn" onclick="openModal()">+ Custom Course</button>
                    <button class="save-png-btn" onclick="downloadSchedule()">📷 Save as Image</button>
                    <button class="clear-btn" onclick="clearSchedule()">Clear All</button>
                </div>
            </div>

            <div class="absolute-grid-container" id="scheduleGrid">
                <div class="grid-header-row">
                    <div class="time-header-cell">Time</div>
                    <div class="day-header-cell">Sun</div>
                    <div class="day-header-cell">Mon</div>
                    <div class="day-header-cell">Tue</div>
                    <div class="day-header-cell">Wed</div>
                    <div class="day-header-cell">Thu</div>
                </div>
                <div class="grid-content-row" id="gridContent">
                    <div class="time-column" id="timeMarkers"></div>
                    <div class="day-column" data-day="Sun"></div>
                    <div class="day-column" data-day="Mon"></div>
                    <div class="day-column" data-day="Tue"></div>
                    <div class="day-column" data-day="Wed"></div>
                    <div class="day-column" data-day="Thu"></div>
                </div>
            </div>
        </div>
    </div>


<div id="customModal" class="modal">
    <div class="modal-content">
        <span class="close" onclick="closeModal()">&times;</span>
        <h3>Add Custom Course</h3>
        
        <div class="form-group">
            <label>Course Name <span style="color:#ff6b6b">*</span></label>
            <input type="text" id="customName" placeholder="e.g., Gym, Study Group">
        </div>

        <div class="form-group">
            <label>Section (Optional)</label>
            <input type="text" id="customSection" placeholder="e.g., AA">
        </div>

        <div class="form-group">
            <label>Instructor (Optional)</label>
            <input type="text" id="customInstructor" placeholder="e.g., Dr. Smith">
        </div>
        <div class="form-group">
            <label>Start Time <span style="color:#ff6b6b">*</span></label>
            <input type="time" id="customStart">
        </div>

        <div class="form-group">
            <label>End Time <span style="color:#ff6b6b">*</span></label>
            <input type="time" id="customEnd">
        </div>

        <div class="form-group">
            <label>Days <span style="color:#ff6b6b">*</span></label>
            <div class="day-checkboxes">
                <label class="checkbox-label"><input type="checkbox" value="Sun"><span>Sun</span></label>
                <label class="checkbox-label"><input type="checkbox" value="Mon"><span>Mon</span></label>
                <label class="checkbox-label"><input type="checkbox" value="Tue"><span>Tue</span></label>
                <label class="checkbox-label"><input type="checkbox" value="Wed"><span>Wed</span></label>
                <label class="checkbox-label"><input type="checkbox" value="Thu"><span>Thu</span></label>
            </div>
        </div>

        <button class="submit-btn" onclick="addCustomCourse()">Add to Schedule</button>
    </div>
</div>

    <script src="script.js"></script>
</body>
</html>
